rk","A culture where everything has to be decided together","Work in which their own contribution stays invisible"]}},{id:"II",coreValues:{nl:["Harmonie","Mogelijkheden"],en:["Harmony","Possibilities"]},goals:"personal",effort:"shared",question:{nl:"Komen we er samen goed uit?",en:"Will this work out well for all of us?"},worldview:{nl:"Ziet het leven als een palet vol kansen en mogelijkheden.",en:"Sees life as a palette full of chances and possibilities."},summary:{nl:"Streeft naar persoonlijk geluk door persoonlijke groei, maar het liefst in overeenstemming en samen met anderen. Daarom is harmonie met de omgeving belangrijk. Om persoonlijk welzijn te bereiken heeft dit perspectief de ander nodig, en het doet ook moeite om het de ander naar de zin te maken.",en:"Pursues personal happiness through personal growth, but preferably in agreement and together with others. That makes harmony with the surroundings important. To reach personal well-being this perspective needs other people — and takes trouble to please them."},drivers:{nl:["Groeien en nieuwe mogelijkheden ontdekken","Een sfeer waarin niemand buiten de boot valt","Waardering en persoonlijke aandacht"],en:["Growing and discovering new possibilities","An atmosphere in which nobody is left out","Appreciation and personal attention"]},decision:{nl:"Peilt eerst hoe anderen erin staan en kiest de weg die het meeste oplevert zonder de onderlinge sfeer te beschadigen.",en:"First gauges where others stand, then picks the route that yields most without damaging the atmosphere."},friction:{nl:["Vindt de directheid van Type I hard en solistisch","Ervaart de plichten en regels van Type III als benauwend","Voelt de principes van Type IV als druk om te kiezen"],en:["Finds Type I's directness harsh and solitary","Experiences Type III's duties and rules as stifling","Feels Type IV's principles as pressure to take sides"]},connect:{nl:["Neem even tijd voor het contact voordat je ter zake komt","Schets mogelijkheden in plaats van één vaste route","Spreek ongenoegen vroeg en vriendelijk uit"],en:["Take a moment for the contact before getting to the point","Sketch possibilities rather than one fixed route","Name dissatisfaction early and kindly"]},resistance:{nl:["Een conflict dat op scherp wordt gezet","Besluiten die over mensen heen gaan","Een omgeving waarin alleen het resultaat telt"],en:["A conflict that gets sharpened rather than settled","Decisions taken over people's heads","An environment where only the result counts"]},works:{nl:["Samenwerken in een open, plezierige sfeer","Ruimte om te leren en zich te ontwikkelen","Afwisseling en zicht op nieuwe kansen"],en:["Working together in an open, pleasant atmosphere","Room to learn and develop","Variety and a view of new chances"]},clash:{nl:["Een harde afrekencultuur","Voortdurende conflicten of onderlinge concurrentie","Werk dat jaar in jaar uit hetzelfde blijft"],en:["A hard, blame-driven culture","Continuous conflict or internal competition","Work that stays the same year after year"]}},{id:"III",coreValues:{nl:["Verantwoordelijkheid","Loyaliteit"],en:["Responsibility","Loyalty"]},goals:"shared",effort:"shared",question:{nl:"Doen we het zoals het hoort?",en:"Are we doing this the way it should be done?"},worldview:{nl:"Ziet het leven als een test die we moeten afleggen.",en:"Sees life as a test we have to pass."},summary:{nl:"Gelooft dat iedereen een bijdrage zou moeten leveren aan de samenleving. Gezamenlijke doelen staan voorop: dit perspectief beschermt het belang van de groep waartoe het behoort door het juiste te doen, op een toegewijde en consequente manier. Sociaal respect weegt zwaar.",en:"Believes everyone should contribute to society. Shared goals come first: this perspective protects the interest of the group it belongs to by doing the right thing, in a committed and consistent way. Social respect weighs heavily."},drivers:{nl:["Bijdragen aan het geheel en de groep niet laten vallen","Afspraken, regels en heldere verwachtingen","Werk dat betrouwbaar en zorgvuldig gebeurt"],en:["Contributing to the whole and not letting the group down","Agreements, rules and clear expectations","Work done reliably and carefully"]},decision:{nl:"Toetst een besluit aan de afspraken en aan het belang van de groep. Beslist zorgvuldig en houdt zich daarna aan de uitkomst.",en:"Tests a decision against the agreements and against the group's interest. Decides carefully and then sticks to the outcome."},friction:{nl:["Ergert zich aan de eigen route van Type I","Vindt Type II te vrijblijvend als het op afspraken aankomt","Botst met Type IV wanneer principes boven de bestaande regels gaan"],en:["Is irritated by Type I going their own way","Finds Type II too non-committal when it comes to agreements","Clashes with Type IV when principles override the existing rules"]},connect:{nl:["Wees duidelijk over verwachtingen en afspraken","Kondig veranderingen op tijd aan en leg uit waarom","Erken de inzet voor het geheel"],en:["Be clear about expectations and agreements","Announce changes in good time and explain why","Acknowledge the effort made for the whole"]},resistance:{nl:["Afspraken die niet worden nagekomen","Uitzonderingen voor wie het beter uitkomt","Losse plannen zonder duidelijke rolverdeling"],en:["Agreements that are not kept","Exceptions for whoever finds them convenient","Loose plans without a clear division of roles"]},works:{nl:["Een organisatie met duidelijke structuur en heldere rollen","Een team waarin men elkaar helpt en aanspreekt","Werk met een zichtbaar gezamenlijk doel"],en:["An organisation with clear structure and clear roles","A team where people help and hold each other to account","Work with a visible shared goal"]},clash:{nl:["Vrijblijvendheid en een steeds wisselende koers","Een cultuur waarin het eigenbelang voorgaat","Onduidelijke verantwoordelijkheden"],en:["Non-commitment and a constantly shifting course","A culture where self-interest comes first","Unclear responsibilities"]}},{id:" z]})}function Pn({icon:b,accent:N,term:z,highlight:r=!1,children:H}){return E.jsxs("div",{children:[E.jsx(ml,{icon:b,accent:N,children:z}),E.jsx("dd",{className:`m-0 mt-1 leading-relaxed ${r?"text-base font-bold text-q4-dark":"text-sm text-slate-600"}`,children:H})]})}const UA={model:"model",behaviour:"waarden-en-gedrag",communication:"communicatie",work:"werkomgeving",report:"rapport",certification:"certificering",faq:"faq"},Po={hero:{eyebrow:"Persoonlijke Waarden",title:"Waarom iemand doet wat hij doet",intro:"Het Persoonlijke Waarden Profiel laat zien welke waarden iemand aansturen: wat er echt toe doet, welke keuzes daaruit volgen en waar wrijving ontstaat met mensen die vanuit een ander perspectief kijken.",ctaPrimary:"Bekijk het model",ctaSecondary:"Voorbeeldprofiel bekijken",trust:["Vier waardenperspectieven","Onderbouwd rapport","Alleen via Certified Partners","Combineert met DISC en EQ-i"]},nav:{label:"Op deze pagina",items:[{id:UA.model,label:"Het model"},{id:UA.behaviour,label:"Waarden en gedrag"},{id:UA.communication,label:"Communicatie"},{id:UA.work,label:"Werkomgeving"},{id:UA.report,label:"Het rapport"},{id:UA.certification,label:"Certificering"},{id:UA.faq,label:"Vragen"}]},intro:{eyebrow:"Wat het is",title:"Het Persoonlijke Waarden Profiel",intro:"Waarden zijn de overtuigingen waaraan iemand vasthoudt: ze bepalen wat als belangrijk, juist en de moeite waard wordt gezien. Ze sturen keuzes, ambities en de manier waarop iemand naar anderen kijkt — meestal zonder dat het met zoveel woorden wordt uitgesproken.",body:["Het profiel brengt die waarden in kaart langs twee vragen: voor welke doelen zet iemand zich in — de eigen doelen of de gezamenlijke — en van wie wordt de inzet verwacht: van zichzelf of van de groep. Die twee vragen leveren vier waardenperspectieven op.","Iedereen herkent zich in alle vier de perspectieven, maar niet even sterk. Het rapport laat zien welk perspectief het zwaarst weegt, hoe uitgesproken dat is, en wat dat betekent voor communicatie, samenwerking en de omgeving waarin iemand tot zijn recht komt.","Geen enkel perspectief is beter dan een ander. Ze verschillen in wat ze belangrijk vinden — en juist dat verschil verklaart veel van de wrijving die in teams ontstaat."],perspectivesTitle:"De vier waardenperspectieven",perspectivesIntro:"Elk perspectief draagt de naam van zijn twee kernwaarden."},model:{eyebrow:"Het model",title:"Vier perspectieven, twee assen",intro:"Kies een perspectief om te zien wat iemand drijft, hoe die beslist, waar wrijving ontstaat met de andere perspectieven en hoe je er in de samenwerking mee omgaat.",figureLabel:"Model van de vier waardenperspectieven",hint:"Klik, of loop met Tab of de pijltjestoetsen langs de vlakken en kies met Enter. Escape zet het model terug.",axes:{top:"Gezamenlijke doelen",bottom:"Persoonlijke doelen",left:"Persoonlijke inzet",right:"Gezamenlijke inzet"},labels:{question:"Kernvraag",axes:"Positie in het model",worldview:"Kijk op het leven",drivers:"Wat drijft iemand",decision:"Hoe beslist iemand",friction:"Waar ontstaat wrijving",connect:"Zo werk je samen"},note:"De namen en teksten hierboven komen uit het Q4-rapport zelf; het profiel scoort alle vier de perspectieven, niet één."},behaviour:{eyebrow:"Waarden en gedrag",title:"Waarom waarden iets anders zijn dan stijl",intro:"Persoonlijke Waarden en Persoonlijke Stijl (DISC) meten twee verschillende lagen. Naast elkaar gelegd verklaren ze waarom iemand iets doet én hoe hij het doet.",columns:[{title:"Persoonlijke Waarden",subtitle:"Het waarom",items:["Bewust gevormd: waarden ontstaan uit opvoeding, ervaring en denken","Veranderbaar: een ingrijpende ervaring of een nieuwe omgeving kan ze verschuiven","Sturen keuzes, ambities en wat iemand de moeite waard vindt","Verklaren waarom samenwerking soms schuurt terwijl het gedrag prima past"]},{title:"Persoonlijke Stijl (DISC)",subtitle:"Het hoe",items:["Grotendeels onbewust: een kernpatroon dat al vroeg vastligt","Stabiel: het patroon blijft door de jaren heen goed herkenbaar","Stuurt tempo, toon en de manier waarop iemand reageert","Verklaart hoe gedrag overkomt op anderen"]}],measuresTitle:"Twee dingen die het rapport apart laat zien",measures:[{title:"Helderheid",body:"Hoe scherp iemand weet wat hij belangrijk vindt. Bij weinig helderheid liggen de vier perspectieven dicht bij elkaar en wisselen keuzes per situatie."},{title:"Intensiteit",body:"Hoe zwaar de waarden wegen. Sterke waarden geven richting en houvast, maar maken het ook lastiger om mee te bewegen met een omgeving die er anders in staat."}],note:"Onder druk komt gedrag vaker voort uit een onvervulde behoefte dan uit een waarde. Het rapport helpt dat verschil te zien — en dat is precies waar een gesprek met een Certified Partner het verschil maakt.",cta:"Bekijk het Persoonlijke Stijl (DISC) profiel"},benefits:{eyebrow:"Wat het oplevert",title:"Waar dit profiel voor gebruikt wordt",intro:"Het Persoonlijke Waarden Profiel wordt ingezet in coaching, teamontwikkeling en loopbaanvragen — overal waar het gedrag klopt maar de motivatie de vraag is.",items:[{title:"Taal voor motivatie",body:"Wat iemand aandrijft wordt bespreekbaar, zonder dat het gesprek in vaagheden blijft hangen."},{title:"Betere keuzes",body:"Loopbaan-, rol- en werkkeuzes worden getoetst aan wat iemand werkelijk belangrijk vindt."},{title:"Minder onverklaarde wrijving",body:"Conflicten in teams blijken vaak een botsing van perspectieven te zijn, niet van personen."},{title:"Passende werkomgeving",body:"Zichtbaar wordt welke cultuur, structuur en sturing iemand energie geven — en welke niet."},{title:"Sterker leiderschap",body:"Leidinggevenden zien hoe ze per medewerker moeten aansluiten om echt draagvlak te krijgen."},{title:"Waarden van de organisatie",body:"De waarden van mensen worden vergelijkbaar met de waarden die de organisatie uitdraagt."}]},communication:{eyebrow:"Communicatie",title:"Aansluiten bij elk perspectief",intro:"Wie vanuit zijn eigen waarden communiceert, mist de ander makkelijk. Per perspectief: wat aansluit, en wat weerstand oproept.",connectLabel:"Zo sluit je aan",resistanceLabel:"Dit roept weerstand op",note:"In het rapport staat dit uitgewerkt voor het eigen perspectief, inclusief de kracht en de valkuil die daarbij horen."},work:{eyebrow:"Werkomgeving",title:"Wat werkt, en wat niet",intro:"Waarden botsen zelden op de inhoud van het werk; ze botsen op de omgeving eromheen. Per perspectief de omstandigheden die energie geven en die energie kosten.",worksLabel:"Werkt goed",clashLabel:"Werkt averechts",note:"Sluiten de waarden van de organisatie aan bij die van de medewerker, dan gaat werken vanzelfmakkelijker. Lopen ze uiteen, dan kost het voortdurend energie."},report:{eyebrow:"Het rapport",title:"Wat er in het profiel staat",intro:"Het rapport is persoonlijk geschreven, in gewone taal, en is bedoeld om samen door te nemen met een Certified Partner.",items:[{title:"Uw waardenperspectief",body:"Het perspectief dat het zwaarst weegt, met kernwaarden en kijk op het leven."},{title:"Score op alle vier",body:"Grafieken met de score op elk perspectief, plus de helderheid en de intensiteit van de waarden."},{title:"Drijfveren",body:"Wat iemand in beweging brengt en waar de energie vandaan komt."},{title:"Groeimogelijkheden",body:"Krachten met de valkuil die eraan vastzit, zodat een sterk punt niet ongemerkt doorschiet."},{title:"Waarden in communicatie",body:"Hoe de waarden doorwerken in het contact met anderen, en wat er dan gebeurt."},{title:"Waarden in de werkomgeving",body:"Wat wel en niet werkt, met concrete tips voor de leidinggevende en voor collega's."},{title:"Achtergronden",body:"Uitleg over het model, over waarden versus behoeften en over hoe waarden zich ontwikkelen."}],note:"Benieuwd hoe dat er in de praktijk uitziet? Het volledige voorbeeldprofiel staat verderop op deze pagina."},audience:{eyebrow:"Voor wie",title:"Wanneer zet je dit profiel in",intro:"Het Persoonlijke Waarden Profiel is geschikt voor volwassenen in werk- en loopbaancontexten en wordt altijd begeleid teruggekoppeld.",items:[{title:"Coaches en trainers",body:"Als verdieping in een coachtraject, naast of na een DISC-profiel."},{title:"Leidinggevenden",body:"Om per medewerker te begrijpen wat motiveert en wat juist afremt."},{title:"Teams",body:"Om terugkerende wrijving te herleiden naar verschillende perspectieven in plaats van naar personen."},{title:"Loopbaanvragen",body:"Bij twijfel over een rol, een overstap of een volgende stap."},{title:"Organisatie en cultuur",body:"Om de waarden van mensen te leggen naast de waarden die de organisatie uitdraagt."},{title:"Werving en selectie",body:"Als gespreksinstrument bij de vraag of iemand past bij de omgeving en de opdracht."}]},process:{eyebrow:"Zo werkt het",title:"Van vragenlijst naar gesprek",intro:"Vier stappen, van uitnodiging tot toepassing in de praktijk.",steps:[{title:"Uitnodiging",body:"Een Certified Partner zet het profiel klaar en stuurt de deelnemer een persoonlijke uitnodiging."},{title:"Online vragenlijst",body:"De deelnemer vult de vragenlijst rustig en online in, op een zelfgekozen moment."},{title:"Rapport en terugkoppeling",body:"Het rapport wordt in een gesprek doorgenomen: herkenning, nuance en de eigen woorden van de deelnemer."},{title:"Toepassen",body:"De uitkomst landt in een coachtraject, een teamsessie of een concrete loopbaankeuze."}]},certification:{eyebrow:"Certificering",title:"Zelf met Persoonlijke Waarden werken",intro:"In de certificatietraining leer je het waardenprofiel afnemen en terugkoppelen, en drijfveren koppelen aan gedrag in coaching en teams.",bullets:["Het model en de vier perspectieven tot in de nuances doorgronden","Oefenen met het terugkoppelen van een rapport","Waarden combineren met Persoonlijke Stijl (DISC) en EQ-i","Na certificering zelf profielen afnemen via het Q4-platform"],cta:"Bekijk de certificatietraining",agendaCta:"Alle waardentrainingen",datesTitle:"Eerstvolgende data",datesEmpty:"Er staan nu geen data gepland. Neem contact op voor de mogelijkheden."},proof:{eyebrow:"Ervaringen",title:"Wat partners erover zeggen",intro:"Q4 Profiles werkt met een netwerk van Certified Partners die de instrumenten dagelijks inzetten.",cta:"Vind een Certified Partner"},lead:{eyebrow:"Voorbeeldprofiel",title:"Bekijk een volledig waardenrapport",intro:"Wil je zien hoe een Persoonlijke Waarden profiel eruitziet? Laat je gegevens achter en bekijk het voorbeeldrapport direct.",bullets:["Het volledige rapport, precies zoals een deelnemer het krijgt","Inclusief grafieken, groeimogelijkheden en tips","Direct te bekijken, zonder wachttijd"],cta:"Voorbeeldprofiel bekijken",dialogTitle:"Voorbeeldprofiel Waarden",dialogDescription:"Laat je gegevens achter om het voorbeeldprofiel te bekijken."},faq:{eyebrow:"Vragen",title:"Veelgestelde vragen",intro:"Staat je vraag er niet bij? Neem gerust contact op.",items:[{q:"Wat meet het Persoonlijke Waarden Profiel?",a:"Het profiel brengt in kaart welke waarden iemand aansturen, verdeeld over vier perspectieven. Je ziet welk perspectief het zwaarst weegt, hoe helder de waarden zijn en hoe intens ze meewegen in keuzes."},{q:"Wat is het verschil met een DISC-profiel?",a:"DISC beschrijft hoe iemand zich gedraagt: tempo, toon en reactie. Waarden beschrijven waarom iemand dat doet. Gedrag is een grotendeels onbewust kernpatroon dat stabiel blijft; waarden zijn bewust gevormd en kunnen veranderen."},{q:"Is er een goed of fout perspectief?",a:"Nee. De vier perspectieven verschillen in wat ze belangrijk vinden, niet in kwaliteit. Elk perspectief heeft eigen krachten en eigen valkuilen."},{q:"Kunnen waarden veranderen?",a:"Ja. Waarden worden gevormd door opvoeding, ervaring en denken. Een ingrijpende gebeurtenis of een nieuwe omgeving kan ze verschuiven — anders dan het gedragspatroon uit DISC, dat stabiel blijft."},{q:"Hoe krijg ik het profiel?",a:"Het profiel loopt altijd via een Certified Partner. Die zet de vragenlijst klaar en neemt het rapport met je door, zodat de uitkomst in jouw context komt te staan."},{q:"Kan ik het profiel zelf leren afnemen?",a:"Ja, via de certificatietraining Persoonlijke Waarden. Daarna neem je zelf profielen af via het Q4-platform en kun je ze combineren met DISC en EQ-i."}]},closing:{eyebrow:"Aan de slag",title:"Benieuwd wat waarden voor jouw praktijk opleveren?",intro:"Vertel kort waar je mee bezig bent. We denken mee over de inzet van het Persoonlijke Waarden Profiel — in coaching, in een team of in de hele organisatie.",points:["Advies over de inzet in jouw situatie","Een Certified Partner in de buurt","Informatie over certificering"],formTitle:"Stel je vraag"},reading:{eyebrow:"Verder lezen",title:"Meer over waarden en drijfveren",intro:"Artikelen uit de Q4-kennisbank die op dit profiel aansluiten.",cta:"Alle artikelen"}},Io={hero:{eyebrow:"Personal Values",title:"Why someone does what they do",intro:"The Personal Values Profile shows which values drive a person: what truly matters, which choices follow from that, and where friction arises with people who look at things from another perspective.",ctaPrimary:"Explore the model",ctaSecondary:"View example profile",trust:["Four value perspectives","Substantiated report","Only through Certified Partners","Combines with DISC and EQ-i"]},nav:{label:"On this page",items:[{id:UA.model,label:"The model"},{id:UA.behaviour,label:"Values and behaviour"},{id:UA.communication,label:"Communication"},{id:UA.work,label:"Work environment"},{id:UA.report,label:"The report"},{id:UA.certification,label:"Certification"},{id:UA.faq,label:"Questions"}]},intro:{eyebrow:"What it is",title:"The Personal Values Profile",intro:"Values are the convictions a person holds on to: they determine what is seen as important, right and worthwhile. They steer choices, ambitions and the way someone looks at others — usually without ever being spelled out.",body:["The profile maps those values along two questions: which goals does someone work towards — their own or the shared ones — and whose effort is expected: their own, or the group's. Those two questions produce four value perspectives.","Everyone recognises something of themselves in all four perspectives, but not to the same degree. The report shows which perspective weighs heaviest, how pronounced that is, and what it means for communication, collaboration and the environment in which someone thrives.","No perspective is better than another. They differ in what they consider important — and that difference explains much of the friction that arises in teams."],perspectivesTitle:"The four value perspectives",perspectivesIntro:"Each perspective is named after its two core values."},model:{eyebrow:"The model",title:"Four perspectives, two axes",intro:"Choose a perspective to see what drives someone, how they decide, where friction with the other perspectives arises and how to work with them.",figureLabel:"Model of the four value perspectives",hint:"Click, or step through the quadrants with Tab or the arrow keys and choose with Enter. Escape resets the model.",axes:{top:"Shared goals",bottom:"Personal goals",left:"Personal effort",right:"Shared effort"},labels:{question:"Core question",axes:"Position in the model",worldview:"View on life",drivers:"What drives them",decision:"How they decide",friction:"Where friction arises",connect:"Working together"},note:"The names and texts above come from the Q4 report itself; the profile scores all four perspectives, not just one."},behaviour:{eyebrow:"Values and behaviour",title:"Why values are not the same as style",intro:"Personal Values and Personal Style (DISC) measure two different layers. Side by side they explain why someone does something as well as how they do it.",columns:[{title:"Personal Values",subtitle:"The why",items:["Consciously formed: values grow out of upbringing, experience and thought","Changeable: a major experience or a new environment can shift them","Steer choices, ambitions and what someone finds worthwhile","Explain why collaboration chafes even when the behaviour fits fine"]},{title:"Personal Style (DISC)",subtitle:"The how",items:["Largely unconscious: a core pattern set early on","Stable: the pattern stays recognisable over the years","Steers pace, tone and the way someone reacts","Explains how behaviour comes across to others"]}],measuresTitle:"Two things the report shows separately",measures:[{title:"Clarity",body:"How sharply someone knows what matters to them. With little clarity the four perspectives sit close together and choices shift from situation to situation."},{title:"Intensity",body:"How heavily the values weigh. Strong values give direction and grip, but also make it harder to move with an environment that sees things differently."}],note:"Under pressure, behaviour more often comes from an unmet need than from a value. The report helps to tell the two apart — and that is exactly where a conversation with a Certified Partner makes the difference.",cta:"See the Personal Style (DISC) profile"},benefits:{eyebrow:"What it delivers",title:"What this profile is used for",intro:"The Personal Values Profile is used in coaching, team development and career questions — wherever the behaviour fits but motivation is the question.",items:[{title:"Language for motivation",body:"What drives a person becomes discussable, without the conversation staying vague."},{title:"Better choices",body:"Career, role and job choices are tested against what someone genuinely finds important."},{title:"Less unexplained friction",body:"Conflicts in teams often turn out to be a clash of perspectives, not of personalities."},{title:"A fitting environment",body:"It becomes visible which culture, structure and management give someone energy — and which do not."},{title:"Stronger leadership",body:"Managers see how to connect with each employee to gain real support."},{title:"Organisational values",body:"People's values become comparable with the values the organisation stands for."}]},communication:{eyebrow:"Communication",title:"Connecting with every perspective",intro:"Anyone communicating from their own values easily misses the other person. Per perspective: what connects, and what provokes resistance.",connectLabel:"How to connect",resistanceLabel:"What provokes resistance",note:"The report works this out for the reader's own perspective, including the strength and the pitfall that come with it."},work:{eyebrow:"Work environment",title:"What works, and what does not",intro:"Values rarely clash with the content of the work; they clash with the environment around it. Per perspective, the conditions that give energy and the ones that drain it.",worksLabel:"Works well",clashLabel:"Works against them",note:"When the organisation's values match the employee's, work becomes easier by itself. When they diverge, it costs energy every single day."},report:{eyebrow:"The report",title:"What the profile contains",intro:"The report is written personally, in plain language, and is meant to be discussed with a Certified Partner.",items:[{title:"Your value perspective",body:"The perspective that weighs heaviest, with core values and view on life."},{title:"Scores on all four",body:"Charts with the score on each perspective, plus the clarity and the intensity of the values."},{title:"Drivers",body:"What sets someone in motion and where their energy comes from."},{title:"Growth opportunities",body:"Strengths with the pitfall attached to each, so a strong point does not overshoot unnoticed."},{title:"Values in communication",body:"How the values work through in contact with others, and what happens then."},{title:"Values at work",body:"What does and does not work, with concrete tips for the manager and for colleagues."},{title:"Background",body:"An explanation of the model, of values versus needs, and of how values develop."}],note:"Curious what that looks like in practice? The full example profile is further down this page."},audience:{eyebrow:"Who it is for",title:"When to use this profile",intro:"The Personal Values Profile suits adults in work and career contexts, and is always fed back in a guided conversation.",items:[{title:"Coaches and trainers",body:"As depth in a coaching programme, alongside or after a DISC profile."},{title:"Managers",body:"To understand what motivates each employee and what holds them back."},{title:"Teams",body:"To trace recurring friction back to different perspectives instead of to personalities."},{title:"Career questions",body:"When there is doubt about a role, a move or a next step."},{title:"Organisation and culture",body:"To place people's values next to the values the organisation stands for."},{title:"Recruitment and selection",body:"As a conversation tool for the question of fit with the environment and the assignment."}]},process:{eyebrow:"How it works",title:"From questionnaire to conversation",intro:"Four steps, from invitation to application in practice.",steps:[{title:"Invitation",body:"A Certified Partner sets up the profile and sends the participant a personal invitation."},{title:"Online questionnaire",body:"The participant completes the questionnaire online, calmly, at a moment of their choosing."},{title:"Report and feedback",body:"The report is discussed in a conversation: recognition, nuance and the participant's own words."},{title:"Application",body:"The outcome lands in a coaching programme, a team session or a concrete career choice."}]},certification:{eyebrow:"Certification",title:"Work with Personal Values yourself",intro:"In the certification training you learn to administer and feed back the values profile, and to link drivers to behaviour in coaching and teams.",bullets:["Understand the model and the four perspectives down to the nuances","Practise feeding back a report","Combine values with Personal Style (DISC) and EQ-i","Administer profiles yourself through the Q4 platform after certification"],cta:"View the certification training",agendaCta:"All values trainings",datesTitle:"Upcoming dates",datesEmpty:"No dates are scheduled right now. Get in touch to discuss the options."},proof:{eyebrow:"Experiences",title:"What partners say about it",intro:"Q4 Profiles works with a network of Certified Partners who use the instruments every day.",cta:"Find a Certified Partner"},lead:{eyebrow:"Example profile",title:"See a complete values report",intro:"Want to see what a Personal Values profile looks like? Leave your details and view the example report straight away.",bullets:["The full report, exactly as a participant receives it","Including charts, growth opportunities and tips","Available immediately, with no waiting"],cta:"View example profile",dialogTitle:"Values example profile",dialogDescription:"Leave your details to view the example profile."},faq:{eyebrow:"Questions",title:"Frequently asked questions",intro:"Question not listed? Feel free to get in touch.",items:[{q:"What does the Personal Values Profile measure?",a:"The profile maps which values drive a person, spread across four perspectives. You see which perspective weighs heaviest, how clear the values are and how intensely they weigh in on choices."},{q:"How is it different from a DISC profile?",a:"DISC describes how someone behaves: pace, tone and reaction. Values describe why they do it. Behaviour is a largely unconscious core pattern that stays stable; values are consciously formed and can change."},{q:"Is there a right or wrong perspective?",a:"No. The four perspectives differ in what they consider important, not in quality. Each perspective has its own strengths and its own pitfalls."},{q:"Can values change?",a:"Yes. Values are shaped by upbringing, experience and thought. A major event or a new environment can shift them — unlike the behavioural pattern from DISC, which stays stable."},{q:"How do I get the profile?",a:"The profile always runs through a Certified Partner. They set up the questionnaire and go through the report with you, so the outcome is placed in your context."},{q:"Can I learn to administer the profile myself?",a:"Yes, through the Personal Values certification training. After that you administer profiles yourself through the Q4 platform and can combine them with DISC and EQ-i."}]},closing:{eyebrow:"Get started",title:"Curious what values could bring to your practice?",intro:"Tell us briefly what you are working on. We will think along about using the Personal Values Profile — in coaching, in a team or across the organisation.",points:["Advice on using it in your situation","A Certified Partner near you","Information about certification"],formTitle:"Ask your question"},reading:{eyebrow:"Further reading",title:"More on values and drivers",intro:"Articles from the Q4 knowledge base that connect to this profile.",cta:"All articles"}},Ko={nl:Po,en:Io},zf=xA.createContext(null);function Jo({children:b,initialLang:N="nl"}){const[z,r]=xA.useState(N),H=xA.useMemo(()=>({lang:z,setLang:r,t:W=>W}),[z]);return E.jsx(zf.Provider,{value:H,children:b})}function Gf(){const b=xA.useContext(zf);if(!b)throw new Error("useLang must be used within LangProvider");return b}var In={exports:{}},ya={},Kn={exports:{}},Jn={};var Yf;function Ro(){return Yf||(Yf=1,(function(b){function N(B,Y){var X=B.length;B.push(Y);A:for(;0<X;){var iA=X-1>>>1,c=B[iA];if(0<H(c,Y))B[iA]=Y,B[X]=c,X=iA;else break A}}function z(B){return B.length===0?null:B[0]}function r(B){if(B.length===0)return null;var Y=B[0],X=B.pop();if(X!==Y){B[0]=X;A:for(var iA=0,c=B.length,y=c>>>1;iA<y;){var C=2*(iA+1)-1,G=B[C],x=C+1,F=B[x];if(0>H(G,X))x<c&&0>H(F,G)?(B[iA]=F,B[x]=X,iA=x):(B[iA]=G,B[C]=X,iA=C);else if(x<c&&0>H(F,X))B[iA]=F,B[x]=X,iA=x;else break A}}return Y}function H(B,Y){var X=B.sortIndex-Y.sortIndex;return X!==0?X:B.id-Y.id}if(b.unstable_now=void 0,typeof performance=="object"&&typeof performance.now=="function"){var W=performance;b.unstable_now=function(){return W.now()}}else{var eA=Date,oA=eA.now();b.unstable_now=function(){return eA.now()-oA}}var M=[],Q=[],T=1,O=null,K=3,wA=
