en in ons gedrag, maar één is het sterkst aanwezig — het primaire temperament — in combinatie met een tweede. Die combinatie bepaalt in grote mate hoe je overkomt.","DISC meet geen kwaliteiten, intelligentie of geschiktheid. Het beschrijft gedrag: wat anderen van je zien en horen. Daarmee is het geen oordeel, maar een gemeenschappelijke taal voor een gesprek dat anders al snel over karakter gaat."],stats:[{value:"4",label:"temperamenten"},{value:"16",label:"stijlen: 4 puur, 12 combinaties"},{value:"2",label:"patronen: kern en gewenst"}]},model:{eyebrow:"Het model",title:"Klik door de vier temperamenten in het Communicatie Grid",intro:"Twee assen bepalen het model: hoe je energie naar buiten brengt (direct of indirect) en waar je aandacht van nature naartoe gaat (taak of mens). Zo ontstaan vier kwadranten: de vier temperamenten. Kies een kwadrant en lees ernaast wat dat temperament typeert. De twaalf combinaties van een primair en een secundair temperament staan met naam in het overzicht hieronder.",gridLabel:"Interactief Communicatie Grid: vier temperamenten rond twee assen",hint:"Klik op een vlak of gebruik tab en enter om een stijl te kiezen. Escape zet het model terug.",axes:{top:"Taakgericht",bottom:"Mensgericht",left:"Indirect · introvert",right:"Direct · extravert"},labels:{question:"Vraagt als eerste",natural:"Natuurlijk gedrag",pressure:"Onder druk",energy:"Krijgt energie van",pitfalls:"Valkuilen",communication:"Zo communiceer je effectief",temperament:"Temperament"},note:"We laten alle vier de temperamenten zien in ons gedrag. Het profiel laat zien hoe sterk elk temperament bij jou aanwezig is en welke de toon zetten: meestal een primair met een secundair, soms één temperament dat er zo ver bovenuit steekt dat het een pure stijl is."},styles:{eyebrow:"De zestien stijlen",title:"Vier pure stijlen en twaalf combinaties",intro:"Je primaire temperament bepaalt de richting, je secundaire kleurt de manier waarop. Dezelfde twee letters in een andere volgorde geven een merkbaar ander beeld: DI is niet hetzelfde als ID. Springt er geen tweede temperament uit, dan is het een pure stijl. Samen zijn dat zestien stijlen, hieronder gegroepeerd per primair temperament.",jumpHint:"Bekijk dit temperament in het model",note:"Wat een stijl in de praktijk betekent — hoe je primaire en je secundaire temperament samenwerken, waar dat je helpt en waar het je in de weg zit — komt aan bod in de debriefing van je profiel en in de certificatietraining."},patterns:{eyebrow:"Twee patronen",title:"Je kernpatroon en je gewenste patroon",intro:"Het profiel meet twee kanten van hetzelfde gedrag. Het verschil tussen die twee is vaak het interessantste onderdeel van een terugkoppelgesprek.",cards:[{title:"Kernpatroon",body:"Het gedrag dat naar boven komt als de omstandigheden minder gunstig zijn: onder druk, bij tegenslag, in een conflict. Dit is je automatische reactie — het patroon dat je niet hoeft te bedenken."},{title:"Gewenst patroon",body:"Het gedrag dat je laat zien als je in je goede doen bent en de omgeving je past. Dit is wat anderen doorgaans van je zien: bewuster gestuurd en meer afgestemd op wat de situatie vraagt."}],note:"Liggen de twee patronen ver uit elkaar? Dan kost het je energie om je aan te passen aan je werk of je omgeving. Dat is geen probleem, maar wel iets om te weten."},communication:{eyebrow:"Herkennen en afstemmen",title:"Zo herken je een stijl — en zo sluit je aan",intro:"Je hoeft iemands profiel niet te kennen om af te stemmen. Aan gedrag, tempo en taalgebruik zie je meestal binnen enkele minuten welk temperament de toon zet.",signalsTitle:"Je herkent het aan",tuneTitle:"Zo sluit je aan",footnote:"Afstemmen is geen toneelspel: je verandert de volgorde en de vorm van je boodschap, niet de inhoud."},report:{eyebrow:"Het rapport",title:"Wat er in het DISC-profiel staat",intro:"Het profiel is een uitgebreid, persoonlijk rapport. Geen scorelijstje, maar een leesbare beschrijving die je samen met een gecertificeerde professional doorneemt.",items:[{title:"Karakteristieken van je persoonlijke stijl",body:"Een beschrijving van je kernpatroon: hoe je van nature handelt, beslist en reageert."},{title:"Talenten en groeimogelijkheden",body:"Waar je stijl je vanzelf sterk in maakt, en waar ontwikkeling het meeste oplevert."},{title:"Sterkten en valkuilen in communicatie",body:"Hoe je overkomt, waar misverstanden ontstaan en wat je daaraan kunt doen."},{title:"Persoonlijke stijl in relatie tot werk",body:"Welke werkomgeving bij je past, en waar de spanning tussen jou en je rol zit."},{title:"Je 'Werkelijke Ik'",body:"Het verschil tussen je kernpatroon en je gewenste patroon, en wat dat verschil je kost."},{title:"Communicatietips per temperament",body:"Concrete handvatten om af te stemmen op de andere drie stijlen."}],languages:{questionnaireBadge:"Vragenlijst in {count} talen",reportBadge:"Rapport in {count} talen",note:"De vragenlijst is er in twee talen meer dan het rapport: deelnemers vullen hem in hun eigen taal in, en kiezen daarna de rapporttaal die het gesprek het beste bedient."}},applications:{eyebrow:"Toepassingen",title:"Waarvoor professionals DISC inzetten",intro:"DISC werkt overal waar gedrag bespreekbaar moet worden zonder dat het over goed of fout gaat.",items:[{title:"Coaching",body:"Maak bewust en onbewust gedrag bespreekbaar en geef het coachgesprek een gemeenschappelijke taal."},{title:"Teamontwikkeling",body:"Laat zien hoe stijlen elkaar aanvullen, waar wrijving vandaan komt en welke stem in het team ontbreekt."},{title:"Communicatie en samenwerking",body:"Herken de stijl van je gesprekspartner en stem de volgorde en de vorm van je boodschap daarop af."},{title:"Leiderschap",body:"Krijg zicht op je natuurlijke leiderschapsstijl en op wat er met je gedrag gebeurt onder druk."},{title:"Loopbaan en ontwikkeling",body:"Breng talenten, valkuilen en groeimogelijkheden concreet in beeld, als basis voor een ontwikkelplan."}]},eqi:{eyebrow:"DISC en EQ-i 2.0",title:"Gedrag zien, en begrijpen wat eronder zit",intro:"De twee instrumenten beantwoorden verschillende vragen. Naast elkaar gelegd geven ze een compleet beeld van iemands functioneren.",discTitle:"DISC laat zien wat je doet",discBody:"Zichtbaar gedrag: hoe je communiceert, beslist en reageert. Dat is wat anderen van je merken.",eqiTitle:"EQ-i 2.0 laat zien wat eronder zit",eqiBody:"Emotionele intelligentie: zelfbeeld, omgaan met emoties, empathie, stresshantering. Vaardigheden die je kunt ontwikkelen.",together:"Samen beantwoorden ze de vraag waar veel ontwikkeltrajecten op stranden: je weet wát er gebeurt, maar niet waaróm het zo gaat. DISC benoemt het patroon, EQ-i 2.0 laat zien welke onderliggende vaardigheid het patroon aanstuurt.",cta:"Bekijk EQ-i 2.0"},extensions:{eyebrow:"Varianten",title:"Eén model, meerdere toepassingen",intro:"Naast het standaardprofiel bestaan er varianten voor specifieke situaties. Ze werken met hetzelfde model, maar met vragen en taal die bij de context passen.",cards:[{title:"Toepassingsprofielen",body:"Varianten van het DISC-profiel voor een specifieke rol of context, zoals commercie, secretarieel werk, studenten of leren en ontwikkelen. Zelfde model, andere invalshoek.",cta:"Bekijk de toepassingsprofielen",href:Nl.applicationProfiles},{title:"Observatieprofielen",body:"Hiermee breng je op basis van je eigen waarnemingen de stijl van een ander in kaart — bijvoorbeeld van een medewerker, klant of kandidaat die zelf geen vragenlijst invult.",cta:"Bekijk de observatieprofielen",href:Nl.observationProfiles}],quickTitle:"Beknopt DISC-profiel",quickBody:"Wil je eerst zelf ervaren hoe het werkt? Met het beknopte profiel vul je een korte vragenlijst in en krijg je direct een eerste indruk van je stijl.",quickCta:"Start het beknopte profiel"},process:{eyebrow:"Zo werkt het",title:"Van vragenlijst naar gesprek",intro:"Een DISC-profiel is geen test die je zelf afneemt en zelf uitlegt. De waarde zit in het gesprek erna.",steps:[{title:"Online vragenlijst",body:"Invullen duurt ongeveer vijftien tot twintig minuten. Er zijn geen goede of foute antwoorden; de eerste ingeving werkt het beste."},{title:"Rapport",body:"Het profiel wordt direct opgemaakt en gaat naar de gecertificeerde professional die je begeleidt."},{title:"Terugkoppelgesprek",body:"Je neemt het rapport samen door: herken je het beeld, waar wijkt het af en wat betekent dat voor je werk?"},{title:"Toepassen",body:"Concrete afspraken over communicatie, samenwerking of ontwikkeling. Vaak is dit het moment waarop het profiel pas echt gaat werken."}]},certification:{eyebrow:"Certificering",title:"Zelf DISC leren afnemen en terugkoppelen",intro:"Het Persoonlijke Stijl (DISC) Profiel is alleen beschikbaar via gecertificeerde professionals. Tijdens de certificering leer je het model lezen, profielen interpreteren en een terugkoppelgesprek voeren dat aankomt.",bullets:["Het model en de theorie achter de vier temperamenten","Kernpatroon en gewenst patroon interpreteren","Een terugkoppelgesprek voeren, ook als het beeld schuurt","DISC toepassen in coaching, teams en organisaties","Toegang tot het Q4-platform om zelf profielen af te nemen"],datesTitle:"Eerstvolgende data",datesEmpty:"Er staan nu geen data in de agenda. Neem contact op voor de eerstvolgende mogelijkheid.",cta:"Bekijk de certificering",agendaCta:"Alle DISC-data"},proof:{eyebrow:"Praktijk",title:"Gebruikt door coaches, trainers en adviseurs",intro:"Gecertificeerde Q4-partners zetten DISC dagelijks in bij coaching, teamontwikkeling en leiderschapstrajecten.",cta:"Vind een gecertificeerde partner"},lead:{eyebrow:"Voorbeeldprofiel",title:"Bekijk een volledig DISC-rapport",intro:"Benieuwd hoe het rapport eruitziet? Vraag een compleet voorbeeldprofiel aan en lees precies wat een deelnemer terugkrijgt.",cta:"Download het voorbeeldprofiel",dialogTitle:"Voorbeeldprofiel DISC",dialogDescription:"Laat je gegevens achter en ontvang direct het volledige voorbeeldrapport.",dialogSubtitle:"Persoonlijke Stijl (DISC)"},faq:{eyebrow:"Veelgestelde vragen",title:"Wat mensen vaak willen weten",items:[{q:"Is DISC een persoonlijkheidstest?",a:"Nee. DISC beschrijft gedrag: wat anderen van je zien en horen. Het meet geen persoonlijkheid, intelligentie of geschiktheid en er is geen goede of foute uitkomst."},{q:"Kun je op DISC zakken of slagen?",a:"Nee. Elke stijl heeft sterke kanten en valkuilen. Het profiel is bedoeld om een gesprek te voeren, niet om te selecteren op de 'juiste' stijl."},{q:"Hoe lang duurt het invullen?",a:"Ongeveer vijftien tot twintig minuten. Het werkt het beste als je op je eerste ingeving afgaat in plaats van lang na te denken."},{q:"Verandert mijn stijl in de loop van de tijd?",a:"Je kernpatroon is redelijk stabiel. Je gewenste patroon beweegt wel mee met je rol en je omstandigheden — daarom kan een profiel na een grote verandering in werk of leven een ander beeld geven."},{q:"Kan ik het profiel zelf aanvragen?",a:"Het profiel loopt altijd via een gecertificeerde professional, omdat de waarde in het terugkoppelgesprek zit. Zoek een partner in de buurt of laat je zelf certificeren."},{q:"In welke talen is het beschikbaar?",a:`De vragenlijst is beschikbaar in ${Qf.nl.join(", ")}. Het rapport verschijnt in ${St.nl.join(", ")} — voor ${Ql.nl.join(" en ")} is er dus wel een vragenlijst, maar geen rapport in die taal.`},{q:"Wat is het verschil met EQ-i 2.0?",a:"DISC beschrijft zichtbaar gedrag; EQ-i 2.0 meet emotionele intelligentie — de vaardigheden onder dat gedrag. Ze sluiten goed op elkaar aan en worden vaak samen ingezet."},{q:"Wat kost een DISC-profiel?",a:"De prijs hangt af van het aantal profielen en de variant. Gecertificeerde partners nemen profielen af tegen partnertarief; neem contact op voor een opgave op maat."}]},closing:{eyebrow:"Aan de slag",title:"DISC inzetten in je eigen praktijk?",intro:"Vertel kort wat je wilt bereiken, dan denken we mee over de vorm: een profiel voor jezelf, een traject voor je team of de certificering zodat je zelf aan de slag kunt.",points:["Persoonlijk advies over de best passende variant","Certificering voor coaches, trainers en HR-professionals","Ondersteuning bij teamtrajecten en organisatievragen"],formTitle:"Stel je vraag",formBody:"We reageren doorgaans binnen één werkdag.",contactCta:"Of bekijk alle contactgegevens"},reading:{eyebrow:"Verder lezen",title:"Artikelen over gedrag en communicatie",intro:"Achtergrond, praktijkvoorbeelden en tips uit de Q4-kennisbank.",cta:"Naar de kennisbank"}},Jo={hero:{eyebrow:"Personal Style (DISC)",title:"Understand why you do what you do — and how you come across",subtitle:"Personal Style (DISC) makes conscious and unconscious behaviour visible: how you naturally act, what changes under pressure, and how to communicate more effectively with people who are wired differently.",ctaPrimary:"Explore the model",ctaSecondary:"Get DISC certified",trust:["Based on Marston's model","Core pattern and desired pattern",`Report in ${St.en.length} languages`,"Available through certified professionals only"]},nav:{label:"Sections on this page",items:[{id:ae.model,label:"Model"},{id:ae.styles,label:"Styles"},{id:ae.communication,label:"Communication"},{id:ae.report,label:"Report"},{id:ae.certification,label:"Certification"},{id:ae.faq,label:"FAQ"}]},intro:{eyebrow:"What is DISC?",title:"Four temperaments, one language for behaviour",paragraphs:["The Personal Style (DISC) Analysis gives you insight into the differences between people, but above all insight into yourself. What is your natural way of doing things? How do you handle situations under pressure? What is your communication style? What are your unconscious drivers?","The model goes back to Dr. William Moulton Marston, who distinguished four fundamental temperaments. We show all four in our behaviour, but one is strongest — the primary temperament — in combination with a second. That combination largely determines how you come across.","DISC does not measure qualities, intelligence or suitability. It describes behaviour: what others see and hear. That makes it not a verdict but a shared language for a conversation that otherwise quickly turns into one about character."],stats:[{value:"4",label:"temperaments"},{value:"16",label:"styles: 4 pure, 12 combinations"},{value:"2",label:"patterns: core and desired"}]},model:{eyebrow:"The model",title:"Explore the four temperaments in the Communication Grid",intro:"Two axes define the model: how you direct your energy outwards (direct or indirect) and where your attention naturally goes (task or people). That produces four quadrants: the four temperaments. Pick a quadrant and read what typifies that temperament beside it. The twelve combinations of a primary and a secondary temperament are named in the overview below.",gridLabel:"Interactive Communication Grid: four temperaments around two axes",hint:"Click, or use tab and enter, to choose a style. Escape resets the model.",axes:{top:"Task-oriented",bottom:"People-oriented",left:"Indirect · introvert",right:"Direct · extravert"},labels:{question:"Asks first",natural:"Natural behaviour",pressure:"Under pressure",energy:"Gains energy from",pitfalls:"Pitfalls",communication:"How to communicate effectively",temperament:"Temperament"},note:"We all show all four temperaments in our behaviour. The profile shows how strongly each temperament is present in you and which ones set the tone: usually a primary with a secondary, sometimes a single temperament standing so far above the rest that it makes a pure style."},styles:{eyebrow:"The sixteen styles",title:"Four pure styles and twelve combinations",intro:"Your primary temperament sets the direction, your secondary colours the way you get there. The same two letters in a different order produce a noticeably different picture: DI is not the same as ID. When no second temperament stands out, it is a pure style. Together that makes sixteen styles, grouped below by primary temperament.",jumpHint:"Open this temperament in the model",note:"What a style means in practice — how your primary and secondary temperament work together, where that helps you and where it gets in your way — is covered in the debrief of your profile and in the certification training."},patterns:{eyebrow:"Two patterns",title:"Your core pattern and your desired pattern",intro:"The profile measures two sides of the same behaviour. The gap between them is often the most interesting part of a feedback conversation.",cards:[{title:"Core pattern",body:"The behaviour that surfaces when circumstances are less favourable: under pressure, in setbacks, in conflict. This is your automatic response — the pattern you do not have to think about."},{title:"Desired pattern",body:"The behaviour you show when you are at your best and the environment suits you. This is what others usually see: more consciously steered and better tuned to what the situation asks for."}],note:"Are the two patterns far apart? Then adapting to your job or your surroundings costs you energy. That is not a problem, but it is worth knowing."},communication:{eyebrow:"Recognise and adapt",title:"How to spot a style — and how to connect with it",intro:"You do not need someone's profile to adapt. Behaviour, pace and choice of words usually reveal within minutes which temperament is setting the tone.",signalsTitle:"You recognise it by",tuneTitle:"How to connect",footnote:"Adapting is not play-acting: you change the order and the form of your message, not its content."},report:{eyebrow:"The report",title:"What the DISC profile contains",intro:"The profile is an extensive, personal report. Not a list of scores, but a readable description that you go through with a certified professional.",items:[{title:"Characteristics of your personal style",body:"A description of your core pattern: how you naturally act, decide and react."},{title:"Talents and growth opportunities",body:"What your style makes you naturally good at, and where development pays off most."},{title:"Communication strengths and pitfalls",body:"How you come across, where misunderstandings arise and what you can do about them."},{title:"Personal style in relation to work",body:"Which working environment suits you, and where the tension between you and your role sits."},{title:"Your 'Real Self'",body:"The difference between your core pattern and your desired pattern, and what that difference costs you."},{title:"Communication tips per temperament",body:"Concrete handles for adapting to the other three styles."}],languages:{questionnaireBadge:"Questionnaire in {count} languages",reportBadge:"Report in {count} languages",note:"The questionnaire runs in two more languages than the report: participants complete it in their own language, then pick the report language that serves the conversation best."}},applications:{eyebrow:"Applications",title:"What professionals use DISC for",intro:"DISC works wherever behaviour has to become discussable without it turning into right or wrong.",items:[{title:"Coaching",body:"Make conscious and unconscious behaviour discussable and give the coaching conversation a shared language."},{title:"Team development",body:"Show how styles complement each other, where friction comes from and which voice the team is missing."},{title:"Communication and collaboration",body:"Recognise the style of the person in front of you and tune the order and form of your message to it."},{title:"Leadership",body:"See your natural leadership style, and what happens to your behaviour under pressure."},{title:"Career and development",body:"Map talents, pitfalls and growth opportunities concretely, as the basis for a development plan."}]},eqi:{eyebrow:"DISC and EQ-i 2.0",title:"See the behaviour, understand what drives it",intro:"The two instruments answer different questions. Side by side they give a complete picture of how someone functions.",discTitle:"DISC shows what you do",discBody:"Visible behaviour: how you communicate, decide and react. That is what others notice about you.",eqiTitle:"EQ-i 2.0 shows what sits underneath",eqiBody:"Emotional intelligence: self-regard, handling emotions, empathy, stress management. Skills you can develop.",together:"Together they answer the question many development programmes get stuck on: you know what is happening, but not why it goes that way. DISC names the pattern, EQ-i 2.0 shows which underlying skill drives it.",cta:"Explore EQ-i 2.0"},extensions:{eyebrow:"Variants",title:"One model, several applications",intro:"Alongside the standard profile there are variants for specific situations. They use the same model, with questions and language that fit the context.",cards:[{title:"Application profiles",body:"Variants of the DISC profile for a specific role or context, such as sales, secretarial work, students, or learning and development. Same model, different angle.",cta:"View the application profiles",href:Nl.applicationProfiles},{title:"Observation profiles",body:"These map another person's style based on your own observations — for instance an employee, client or candidate who does not fill in a questionnaire themselves.",cta:"View the observation profiles",href:Nl.observationProfiles}],quickTitle:"Short DISC profile",quickBody:"Want to experience how it works first? The short profile is a brief questionnaire that gives you an immediate first impression of your style.",quickCta:"Start the short profile"},process:{eyebrow:"How it works",title:"From questionnaire to conversation",intro:"A DISC profile is not a test you take and interpret on your own. The value is in the conversation afterwards.",steps:[{title:"Online questionnaire",body:"Filling it in takes about fifteen to twenty minutes. There are no right or wrong answers; your first instinct works best."},{title:"Report",body:"The profile is generated immediately and goes to the certified professional guiding you."},{title:"Feedback conversation",body:"You go through the report together: do you recognise the picture, where does it differ, and what does that mean for your work?"},{title:"Putting it to use",body:"Concrete agreements about communication, collaboration or development. This is often the moment the profile really starts to work."}]},certification:{eyebrow:"Certification",title:"Learn to administer and debrief DISC yourself",intro:"The Personal Style (DISC) Profile is available through certified professionals only. During the certification you learn to read the model, interpret profiles and hold a feedback conversation that lands.",bullets:["The model and the theory behind the four temperaments","Interpreting the core pattern and the desired pattern","Holding a feedback conversation, also when the picture stings","Applying DISC in coaching, teams and organisations","Access to the Q4 platform to administer profiles yourself"],datesTitle:"Upcoming dates",datesEmpty:"There are no dates in the agenda right now. Get in touch for the next opportunity.",cta:"View the certification",agendaCta:"All DISC dates"},proof:{eyebrow:"In practice",title:"Used by coaches, trainers and consultants",intro:"Certified Q4 partners use DISC every day in coaching, team development and leadership programmes.",cta:"Find a certified partner"},lead:{eyebrow:"Sample profile",title:"See a complete DISC report",intro:"Curious what the report looks like? Request a full sample profile and read exactly what a participant receives.",cta:"Download the sample profile",dialogTitle:"Sample profile DISC",dialogDescription:"Leave your details and receive the full sample report right away.",dialogSubtitle:"Personal Style (DISC)"},faq:{eyebrow:"Frequently asked questions",title:"What people often want to know",items:[{q:"Is DISC a personality test?",a:"No. DISC describes behaviour: what others see and hear. It does not measure personality, intelligence or suitability, and there is no right or wrong outcome."},{q:"Can you pass or fail DISC?",a:"No. Every style has strengths and pitfalls. The profile exists to start a conversation, not to select for the 'right' style."},{q:"How long does it take to complete?",a:"About fifteen to twenty minutes. It works best when you go with your first instinct rather than deliberating."},{q:"Does my style change over time?",a:"Your core pattern is fairly stable. Your desired pattern does move with your role and your circumstances — which is why a profile can look different after a major change in work or life."},{q:"Can I request the profile myself?",a:"The profile always runs through a certified professional, because the value is in the feedback conversation. Find a partner nearby, or get certified yourself."},{q:"Which languages is it available in?",a:`The questionnaire is available in ${Qf.en.join(", ")}. The report comes in ${St.en.join(", ")} — so for ${Ql.en.join(" and ")} there is a questionnaire, but no report in that language.`},{q:"What is the difference with EQ-i 2.0?",a:"DISC describes visible behaviour; EQ-i 2.0 measures emotional intelligence — the skills underneath that behaviour. They complement each other well and are often used together."},{q:"What does a DISC profile cost?",a:"The price depends on the number of profiles and the variant. Certified partners administer profiles at partner rates; get in touch for a tailored quote."}]},closing:{eyebrow:"Get started",title:"Put DISC to work in your own practice?",intro:"Tell us briefly what you want to achieve and we will think along about the format: a profile for yourself, a programme for your team, or the certification so you can run it yourself.",points:["Personal advice on the best-fitting variant","Certification for coaches, trainers and HR professionals","Support for team programmes and organisational questions"],formTitle:"Ask your question",formBody:"We usually reply within one working day.",contactCta:"Or see all contact details"},reading:{eyebrow:"Further reading",title:"Articles on behaviour and communication",intro:"Background, practical examples and tips from the Q4 knowledge base.",cta:"To the knowledg
